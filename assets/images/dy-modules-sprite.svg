<svg xmlns="http://www.w3.org/2000/svg" style="display:none;width:0;height:0;position:absolute" aria-hidden="true">
	<!--
		Double Youpi — module icon sprite.
		Source SVG : assets/images/dy-modules-sprite.svg
		Consumed via <use href="#dy-icon-{module-id}"> from PHP (IconSprite::print()).

		Spec :
		- viewBox 24×24
		- stroke="currentColor" 1.5px, round caps/joins, fill="none"
		- chaque <path> a pathLength="100" pour permettre une animation line-draw
		  uniforme via stroke-dashoffset 100 → 0 (cf. partials/overview/_icons.scss)
		- class="dy-draw" sur les paths qu'on veut animer au hover
	-->

	<defs>
		<!-- ─ admin : window chrome with a small cursor inside ───────── -->
		<symbol id="dy-icon-admin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<rect class="dy-draw" pathLength="100" x="3" y="4.5" width="18" height="15" rx="1.8" />
			<path class="dy-draw" pathLength="100" d="M3 8.5h18" />
			<circle class="dy-draw" pathLength="100" cx="6.2" cy="6.5" r="0.6" />
			<circle class="dy-draw" pathLength="100" cx="8.4" cy="6.5" r="0.6" />
			<path class="dy-draw" pathLength="100" d="M11 13l3.2 2.4 1-2.2 2.4 1L11 13z" />
		</symbol>

		<!-- ─ media-library : stacked images, top one slightly forward ─ -->
		<symbol id="dy-icon-media-library" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<rect class="dy-draw" pathLength="100" x="3.5" y="3.5" width="13" height="13" rx="1.8" />
			<path class="dy-draw" pathLength="100" d="M7 19.5h11.7c.99 0 1.8-.8 1.8-1.8V7" />
			<circle class="dy-draw" pathLength="100" cx="7.5" cy="7.8" r="1.1" />
			<path class="dy-draw" pathLength="100" d="M4.2 14.2l3-3.2 2.6 2.5 3-3.4 3.2 4.1" />
		</symbol>

		<!-- ─ performance : speedometer with needle pointing top-right ─ -->
		<symbol id="dy-icon-performance" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<path class="dy-draw" pathLength="100" d="M4 17a8 8 0 1 1 16 0" />
			<path class="dy-draw" pathLength="100" d="M12 17l3.8-5.5" />
			<circle class="dy-draw" pathLength="100" cx="12" cy="17" r="1.1" />
			<path class="dy-draw" pathLength="100" d="M4.7 14.4l1.3.5M19.3 14.4l-1.3.5M7 10.4l1 .9M17 10.4l-1 .9" />
		</symbol>

		<!-- ─ static-site : page with </> in center ─────────────────── -->
		<symbol id="dy-icon-static-site" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<path class="dy-draw" pathLength="100" d="M6 3.5h8.5L19 8v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19V5a1.5 1.5 0 0 1 1-1.5z" />
			<path class="dy-draw" pathLength="100" d="M14.5 3.5V8H19" />
			<path class="dy-draw" pathLength="100" d="M10 12.5l-2 2 2 2" />
			<path class="dy-draw" pathLength="100" d="M14 12.5l2 2-2 2" />
			<path class="dy-draw" pathLength="100" d="M12.6 11.5l-1.2 6" />
		</symbol>

		<!-- ─ toolkit : crossed wrench + screwdriver ────────────────── -->
		<symbol id="dy-icon-toolkit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<path class="dy-draw" pathLength="100" d="M15 4.5a3.5 3.5 0 0 1 4.6 4.6l-2.4-.9-1.6 1.6.9 2.4a3.5 3.5 0 0 1-4.6-4.6L9.5 9.7" />
			<path class="dy-draw" pathLength="100" d="M11.9 7.6L4.6 14.9a1.6 1.6 0 0 0 0 2.3l1.7 1.7a1.6 1.6 0 0 0 2.3 0l7.3-7.3" />
			<path class="dy-draw" pathLength="100" d="M6.4 16.5l1.3 1.3" />
		</symbol>

		<!-- ─ seo-a11y : eye with iris ring (universal-access nod) ──── -->
		<symbol id="dy-icon-seo-a11y" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<path class="dy-draw" pathLength="100" d="M2.5 12c2-4 5.5-6.5 9.5-6.5s7.5 2.5 9.5 6.5c-2 4-5.5 6.5-9.5 6.5S4.5 16 2.5 12z" />
			<circle class="dy-draw" pathLength="100" cx="12" cy="12" r="3.2" />
			<circle class="dy-draw" pathLength="100" cx="12" cy="12" r="1.1" />
		</symbol>

		<!-- ─ metrics : bar chart with ascending arrow ──────────────── -->
		<symbol id="dy-icon-metrics" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<path class="dy-draw" pathLength="100" d="M3.5 20.5h17" />
			<path class="dy-draw" pathLength="100" d="M6 20.5V14" />
			<path class="dy-draw" pathLength="100" d="M11 20.5V10" />
			<path class="dy-draw" pathLength="100" d="M16 20.5V6.5" />
			<path class="dy-draw" pathLength="100" d="M4.5 8.5L9 12.5l3.5-3 4.5 4 3-3" />
			<path class="dy-draw" pathLength="100" d="M20.5 5.5v3h-3" />
		</symbol>

		<!-- ─ backups : drum with circular restore arrow ────────────── -->
		<symbol id="dy-icon-backups" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<ellipse class="dy-draw" pathLength="100" cx="12" cy="6" rx="6.5" ry="2.3" />
			<path class="dy-draw" pathLength="100" d="M5.5 6v6.2c0 1.3 2.9 2.3 6.5 2.3s6.5-1 6.5-2.3V6" />
			<path class="dy-draw" pathLength="100" d="M18.5 12.5v3.5c0 1.3-2.9 2.3-6.5 2.3-1.4 0-2.7-.16-3.8-.4" />
			<path class="dy-draw" pathLength="100" d="M8 21l-2.4-2.4L8 16.2" />
			<path class="dy-draw" pathLength="100" d="M5.6 18.6c0 1.3 2.9 2.3 6.4 2.3" />
		</symbol>

		<!-- ─ staging : git branch (two circles joined by curve) ────── -->
		<symbol id="dy-icon-staging" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<circle class="dy-draw" pathLength="100" cx="7" cy="5.5" r="2" />
			<circle class="dy-draw" pathLength="100" cx="7" cy="18.5" r="2" />
			<circle class="dy-draw" pathLength="100" cx="17" cy="11.5" r="2" />
			<path class="dy-draw" pathLength="100" d="M7 7.5v9" />
			<path class="dy-draw" pathLength="100" d="M7 8.5c0 2.5 2 4 5 4h3" />
		</symbol>

		<!-- ─ Auxiliary icons reused by sub-pages ──────────────────── -->

		<!-- folder (Media Library tree, closed) -->
		<symbol id="dy-icon-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<path class="dy-draw" pathLength="100" d="M3.5 7.5a1.5 1.5 0 0 1 1.5-1.5h4.2l1.6 1.8h8.7a1.5 1.5 0 0 1 1.5 1.5v8.7a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5z" />
		</symbol>

		<!-- folder open -->
		<symbol id="dy-icon-folder-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<path class="dy-draw" pathLength="100" d="M3.5 18V7.5a1.5 1.5 0 0 1 1.5-1.5h4.2l1.6 1.8h8.7a1.5 1.5 0 0 1 1.5 1.5v.7" />
			<path class="dy-draw" pathLength="100" d="M3.5 18l2.2-7h16l-2.2 7a1.5 1.5 0 0 1-1.4 1.1H5a1.5 1.5 0 0 1-1.5-1.5z" />
		</symbol>

		<!-- collection -->
		<symbol id="dy-icon-collection" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<rect class="dy-draw" pathLength="100" x="3.5" y="3.5" width="11" height="11" rx="1.6" />
			<path class="dy-draw" pathLength="100" d="M8 20.5h10.5a2 2 0 0 0 2-2V8" />
		</symbol>

		<!-- chevron (collapse/expand) -->
		<symbol id="dy-icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<path class="dy-draw" pathLength="100" d="M9 6l6 6-6 6" />
		</symbol>

		<!-- check (state OK on diagnostics) -->
		<symbol id="dy-icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<path class="dy-draw" pathLength="100" d="M5 12l4.5 4.5L19 7" />
		</symbol>

		<!-- arrow (sub-page right arrow) -->
		<symbol id="dy-icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
			<path class="dy-draw" pathLength="100" d="M5 12h14" />
			<path class="dy-draw" pathLength="100" d="M13 6l6 6-6 6" />
		</symbol>
	</defs>
</svg>
